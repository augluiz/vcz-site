name: Keep Render API Alive

on:
  schedule:
    # A cada 14 minutos (Render hiberna após 15 min)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://vcz-api.onrender.com/api/v1/comex/publico/ping)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Aviso: API retornou $STATUS"
          fi
