name: Atualizar dados CEPEA

# ATENCAO — AGENDAMENTO DESLIGADO EM 25/10/2026
#
# A Cloudflare do CEPEA passou a bloquear o IP dos runners do GitHub
# Actions (datacenter). Desde 05/10/2026 a execucao diaria falhava com
# "pagina bloqueada por verificacao de seguranca" em 17 dos 18 produtos,
# e o painel ficou tres semanas com dado velho sem ninguem notar.
#
# Confirmado em 25/10: o MESMO script roda sem erro a partir de um IP
# residencial. Nao e o codigo nem os headers — e o IP de origem.
#
# A coleta passou a rodar na maquina local, agendada por
#   cepea_dashboard/agendar_atualizacao.ps1
#
# O gatilho manual continua aqui de proposito: se um dia a Cloudflare
# liberar, basta rodar pela aba Actions para conferir antes de religar
# o cron. Nao reativar o schedule sem esse teste.
on:
  workflow_dispatch:          # botao "Run workflow" manual na aba Actions

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # necessario para fazer commit de volta ao repositorio

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'cepea_dashboard/requirements.txt'

      - name: Instalar dependencias Python
        run: pip install -r cepea_dashboard/requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      # Sem continue-on-error de proposito: com ele o workflow ficava verde mesmo
      # quando o CEPEA bloqueava a coleta inteira, e a falha passava semanas sem
      # ser notada. O script sai com codigo 1 so quando a MAIORIA dos produtos
      # falha — produto isolado com erro nao derruba a execucao.
      - name: Atualizar indicadores CEPEA
        working-directory: cepea_dashboard
        run: python atualizar_diario.py

      - name: Commitar e publicar dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cepea_dashboard/dados/
          # Só commita se houver mudanca real (evita commits vazios)
          git diff --staged --quiet || git commit -m "data: atualiza indicadores CEPEA $(date +%Y-%m-%d)"
          git push
