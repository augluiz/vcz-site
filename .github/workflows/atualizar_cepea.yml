name: Atualizar dados CEPEA

# As paginas publicas de indicador do CEPEA ficam disponiveis o dia todo
# (nao dependem de um PDF publicado em horario incerto, como o CEASA) —
# por isso uma unica execucao diaria e suficiente.
#
# Horario em UTC (Brasil = UTC-3, sem horario de verao):
#   12:00 UTC = 09:00 BRT
on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 BRT, todos os dias
  workflow_dispatch:          # botao "Run workflow" manual na aba Actions

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # necessario para fazer commit de volta ao repositorio

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'cepea_dashboard/requirements.txt'

      - name: Instalar dependencias Python
        run: pip install -r cepea_dashboard/requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Atualizar indicadores CEPEA
        working-directory: cepea_dashboard
        run: python atualizar_diario.py
        continue-on-error: true   # nao cancela o workflow se o CEPEA estiver fora

      - name: Commitar e publicar dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cepea_dashboard/dados/
          # Só commita se houver mudanca real (evita commits vazios)
          git diff --staged --quiet || git commit -m "data: atualiza indicadores CEPEA $(date +%Y-%m-%d)"
          git push
